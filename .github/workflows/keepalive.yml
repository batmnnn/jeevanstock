name: keep demo stock fresh

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post one shift for each demo centre on Tiramisu
        run: npm run seed
        env:
          ARKIV_API_KEY: ${{ secrets.ARKIV_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PAYER_KEY: ${{ secrets.PAYER_KEY }}
          CENTRE_KEYS: ${{ secrets.CENTRE_KEYS }}
